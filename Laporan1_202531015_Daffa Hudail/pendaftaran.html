<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Praktikum - Pendaftaran</title>
</head>
<body>
    <nav> |
        <a href="index.html" >Beranda</a> |
        <a href="pendaftaran.html" >Pendaftaran</a> |
    </nav>

    <hr>

    <h2>Form Pendaftaran Praktikan</h2>

    <form action="" method="post">
    <table>
        <tr>
            <td width="120">Nama Lengkap</td>
            <td><input type="text" /></td>
        </tr>

        <tr>
            <td>Password</td>
            <td><input type="password" /></td>
        </tr>

        <tr>
            <td>NIM</td>
            <td><input type="number" /></td>
        </tr>

        <tr>
            <td>Tanggal</td>
            <td><input type="date" /></td>
        </tr>

        <tr>
            <td>Jenis Kelamin</td>
            <td>
                <input type="radio" name="jenis_kelamin" value="laki-laki" /> Laki-laki
                <input type="radio" name="jenis_kelamin" value="perempuan" /> Perempuan
            </td>
        </tr>
        
        <tr>
            <td>Hobi</td>
            <td><input type="checkbox" /> Web
                <input type="checkbox" /> Jaringan
                <input type="checkbox" /> Design/Modeling
            </td>
        </tr>

        <tr>
            <td>Program Studi</td>
            <td>
                <select>
                    <option>S1 Teknik Informatika</option>
                    <option>S1 Sistem Informasi</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Alasan Mendaftar</td>
            <td><textarea name="alasan" rows="3" cols="20"></textarea></td>
        </tr>

        <tr>
            <td></td>
            <td><input type="submit" value="Kirim" />
                <input type="reset" value="Reset" />
            </td>
        </tr>
</body>
</html>
